<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>La Oveja +Q Negra</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d4af37;
--bg:#080808;
--text:#f5f1e8;
--muted:#cfc7b8;
--shadow:0 24px 70px rgba(0,0,0,.35);
}

body{
margin:0;
font-family:'Inter', sans-serif;
background:#080808;
color:white;
}

/* NAV */
.nav{
position:fixed;
width:100%;
top:0;
background:#000;
padding:20px 40px;
display:flex;
justify-content:space-between;
z-index:1000;
}

.nav a{color:white;text-decoration:none;margin:0 10px;}

.btn{
background:var(--gold);
padding:10px 20px;
border-radius:30px;
color:black;
font-weight:bold;
}

/* HERO */
.hero{
height:90vh;
display:flex;
align-items:center;
padding:100px 40px;
background:black;
}

.hero h1{
font-family:'Cormorant Garamond', serif;
font-size:60px;
}

.hero span{color:var(--gold);}

/* SECTION */
.section{
padding:100px 40px;
}

.section-title{
text-align:center;
font-size:40px;
color:var(--gold);
font-family:'Cormorant Garamond';
}

/* GALERIA */
.gallery-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.gallery-item{
min-height:320px;
position:relative;
overflow:hidden;
border-radius:20px;
box-shadow:var(--shadow);
}

.gallery-item:hover{
transform:scale(1.02);
}

.gallery-image{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
transition:0.5s;
}

.gallery-item:hover .gallery-image{
transform:scale(1.1);
}

.gallery-overlay{
position:absolute;
bottom:0;
width:100%;
padding:20px;
background:linear-gradient(transparent, black);
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
<div>La Oveja +Q Negra</div>
<div>
<a href="#galeria">Galería</a>
<a href="#contacto">Contacto</a>
<a class="btn">Reservar</a>
</div>
</div>

<!-- HERO -->
<section class="hero">
<div>
<h1>Experiencias con queso que <span>se recuerdan</span></h1>
<p>Diseñamos mesas de quesos artesanales únicas.</p>
</div>
</section>

<!-- GALERIA -->
<section class="section" id="galeria">
<h2 class="section-title">Galería</h2>

<div class="gallery-grid">

<article class="gallery-item">
<img src="./imagenes/foto-01.jpg" class="gallery-image">
<div class="gallery-overlay">
<strong>Mesa principal</strong>
</div>
</article>

<article class="gallery-item">
<img src="./imagenes/foto-02.jpg" class="gallery-image">
<div class="gallery-overlay">
<strong>Evento especial</strong>
</div>
</article>

<article class="gallery-item">
<img src="./imagenes/foto-03.jpg" class="gallery-image">
<div class="gallery-overlay">
<strong>Detalle gourmet</strong>
</div>
</article>

</div>
</section>

</body>
</html>
